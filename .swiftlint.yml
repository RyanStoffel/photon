included:
  - Sources
  - Tests

excluded:
  - .build
  - .swiftpm
  - build

disabled_rules:
  - todo
  - trailing_comma

opt_in_rules:
  - empty_count
  - explicit_init
  - overridden_super_call
  - vertical_whitespace_closing_braces

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 800

type_body_length:
  warning: 400
  error: 600

function_body_length:
  warning: 80
  error: 120

identifier_name:
  min_length:
    warning: 1
  max_length:
    warning: 50
    error: 60

reporter: "xcode"
