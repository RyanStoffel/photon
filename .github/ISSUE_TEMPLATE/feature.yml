name: Feature
description: Propose a new capability or an enhancement to an existing one.
title: "feat: "
labels:
  - type/feature
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - launcher
        - clipboard
        - notes
        - files
        - keybinds
        - windows
        - settings
        - ci
        - release
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should Photon do that it does not do today?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A short checklist a reviewer can verify.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Design constraints, out-of-scope items, or links.
