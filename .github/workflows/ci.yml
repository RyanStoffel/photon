name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branch-name:
    name: branch-name
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Check branch name
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            Scripts/check-branch-name.sh "$HEAD_REF"
          else
            Scripts/check-branch-name.sh "$REF_NAME"
          fi

  lint:
    name: lint
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Install lint tools
        run: |
          if ! command -v swiftformat >/dev/null; then brew install swiftformat; fi
          if ! command -v swiftlint >/dev/null; then brew install swiftlint; fi
      - name: SwiftFormat
        run: swiftformat --lint --config .swiftformat .
      - name: SwiftLint
        run: swiftlint lint --strict --config .swiftlint.yml

  test:
    name: test
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: .build
          key: test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Sources/**/*.swift', 'Tests/**/*.swift') }}
          restore-keys: |
            test-${{ runner.os }}-${{ runner.arch }}-
      - name: Run focused parity fixtures
        run: Scripts/check-harness.sh
      - name: Run full unit test suite
        run: swift test --package-path .

  build:
    name: build
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: .build
          key: build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Sources/**/*.swift') }}
          restore-keys: |
            build-${{ runner.os }}-${{ runner.arch }}-
      - name: Release build
        run: Scripts/package_app.sh
      - name: Zip app bundle
        # ditto keeps executable bits and the code signature; upload-artifact alone does not.
        run: ditto -c -k --keepParent build/Photon.app build/Photon.app.zip
      - name: Upload Photon.app
        uses: actions/upload-artifact@v7
        with:
          name: Photon.app
          path: build/Photon.app.zip
          if-no-files-found: error

  smoke:
    name: smoke
    runs-on: macos-latest
    needs: build
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Download Photon.app
        uses: actions/download-artifact@v8
        with:
          name: Photon.app
          path: build
      - name: Unpack
        run: ditto -x -k build/Photon.app.zip build
      - name: Launch and watch
        env:
          SMOKE_LOG: ${{ runner.temp }}/photon-smoke.log
        run: Scripts/smoke-test.sh build/Photon.app
      - name: Exercise native macOS parity
        env:
          NATIVE_PARITY_SCREENSHOT_DIR: ${{ runner.temp }}/photon-native-parity-screenshots
        run: Scripts/check-native-parity.sh build/Photon.app
      - name: Upload native parity screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-parity-screenshots
          path: ${{ runner.temp }}/photon-native-parity-screenshots/*.png
          if-no-files-found: error
      - name: Upload smoke test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-log
          path: ${{ runner.temp }}/photon-smoke.log
          if-no-files-found: ignore
