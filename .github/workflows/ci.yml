# CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branch-name:
    name: branch-name
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Check branch name
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            Scripts/check-branch-name.sh "$HEAD_REF"
          else
            Scripts/check-branch-name.sh "$REF_NAME"
          fi

  lint:
    name: lint
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings -A dead_code -A unused_imports -A unused_variables -A clippy::too_many_arguments -A clippy::field_reassign_with_default

  test:
    name: test
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/**/*.rs', 'Cargo.toml') }}
          restore-keys: |
            test-${{ runner.os }}-${{ runner.arch }}-
      - name: Harness and unit tests
        run: Scripts/check-harness.sh
      - name: Workspace tests
        run: cargo test --workspace

  build:
    name: build
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/**/*.rs', 'Cargo.toml') }}
          restore-keys: |
            build-${{ runner.os }}-${{ runner.arch }}-
      - name: Release build
        run: Scripts/package_app.sh
      - name: Zip app bundle
        run: ditto -c -k --keepParent build/Photon.app build/Photon.app.zip
      - name: Upload Photon.app
        uses: actions/upload-artifact@v7
        with:
          name: Photon.app
          path: build/Photon.app.zip
          if-no-files-found: error

  smoke:
    name: smoke
    runs-on: macos-latest
    needs: build
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Download Photon.app
        uses: actions/download-artifact@v4
        with:
          name: Photon.app
          path: build
      - name: Unpack
        run: ditto -x -k build/Photon.app.zip build
      - name: Launch and watch
        env:
          SMOKE_LOG: ${{ runner.temp }}/photon-smoke.log
        run: Scripts/smoke-test.sh build/Photon.app
      - name: Upload smoke test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-log
          path: ${{ runner.temp }}/photon-smoke.log
          if-no-files-found: ignore
