[workspace]
resolver = "2"
members = [
  "crates/photon-core",
  "crates/photon-clipboard",
  "crates/photon-files",
  "crates/photon",
]
default-members = [
  "crates/photon-core",
  "crates/photon-clipboard",
  "crates/photon-files",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
authors = ["Ryan Stoffel <stoffel.thomas.ryan@gmail.com>"]
repository = "https://github.com/RyanStoffel/photon"
rust-version = "1.88"

[workspace.dependencies]
photon-core = { path = "crates/photon-core" }
photon-clipboard = { path = "crates/photon-clipboard" }
photon-files = { path = "crates/photon-files" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
dirs = "6"
sha2 = "0.10"
hex = "0.4"
unicode-normalization = "0.1"
walkdir = "2"
which = "7"
png = "0.17"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "symbols"
